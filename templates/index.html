<head>
    <title>ProfGPT - Cal Poly Professor Reviews</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<body class="bg-light">
    <header class="bg-success text-white text-center py-4 mb-4 shadow-sm">
        <h1 class="fw-bold mb-1">ProfGPT 🐎</h1>
        <p class="mb-1 opacity-75">AI-Powered Professor Analysis for Cal Poly</p>
        <p class="small mb-0 opacity-75">

        <div class="row justify-content-center">
            <div class="col-12 col-lg-7">
                <div class="card shadow-sm border-top border-4 border-gold p-4">
                    <form id="queryForm">
                        <label for="query" class="form-label fw-semibold text-success">
                            Ask about your professor:
                        </label>
                        <input id="query" type="text" class="form-control form-control-lg mb-3"
                            placeholder="e.g. How is Dr. Keen grading?">
                        <button type="submit" class="btn btn-success btn-lg w-100 text-uppercase">
                            Analyze Professor
                        </button>
                        <p class="text-muted small text-center mt-2 mb-0">
                            Limited to 10 searches per minute
                        </p>
                    </form>
                </div>
                <div id="result" class="mt-4"></div>
            </div>
        </div>
    </main>

    <footer class="bg-success text-white text-center py-4 mt-5">
